#
# Dependabot version-update PRs. NOTE: this file only opens update PRs — it does
# NOT enable vulnerability *alerts*. Turn those on once in the repo UI:
#   Settings -> Code security -> Dependabot alerts (+ "Dependabot security updates").
version: 2
updates:
  # Dart / Flutter packages (pubspec.yaml). Minor + patch bumps are grouped into
  # one weekly PR to keep noise down; majors still come as their own PRs so each
  # breaking change stays isolated and reviewable.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions pinned in .github/workflows/*.yml (checkout, flutter-action,
  # setup-python, deploy-pages, wrangler-action, setup-dart, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
